name: 'Python CI/CD Pipeline'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'requirements*.txt'
      - 'setup.py'
      - '.github/workflows/python-workflow.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'requirements*.txt'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  PYTHON_VERSION: '3.9'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  lint-and-test:
    name: 'Lint and Test'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        pytest --cov=src tests/ --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: 'Build Package'
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
        
    - name: Build package
      run: |
        python -m build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/
        retention-days: 7

  deploy-to-databricks:
    name: 'Deploy to Databricks'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ env.ENVIRONMENT }}
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
        
    - name: Install Databricks CLI
      run: |
        pip install databricks-cli
        
    - name: Configure Databricks CLI
      run: |
        echo "host=${{ env.DATABRICKS_HOST }}" > ~/.databrickscfg
        echo "token=${{ env.DATABRICKS_TOKEN }}" >> ~/.databrickscfg
        
    - name: Create deployment directory
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        mkdir -p $DEPLOY_DIR
        cp dist/* $DEPLOY_DIR/
        cp -r src/* $DEPLOY_DIR/
        if [ -f requirements.txt ]; then cp requirements.txt $DEPLOY_DIR/; fi
        
    - name: Deploy to Databricks
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        DBFS_PATH="/dbfs/FileStore/python_deployments/${{ env.ENVIRONMENT }}/$DEPLOY_DIR"
        
        # Create DBFS directory
        databricks fs mkdirs "dbfs:/FileStore/python_deployments/${{ env.ENVIRONMENT }}/$DEPLOY_DIR"
        
        # Upload files to DBFS
        databricks fs cp -r $DEPLOY_DIR "dbfs:/FileStore/python_deployments/${{ env.ENVIRONMENT }}/"
        
        # Create or update job if needed
        if [ -f "databricks-job-${{ env.ENVIRONMENT }}.json" ]; then
          # Update job configuration with new deployment path
          sed -i "s|/dbfs/FileStore/python_deployments/${{ env.ENVIRONMENT }}/[^/]*/|$DBFS_PATH/|g" "databricks-job-${{ env.ENVIRONMENT }}.json"
          
          # Create or update job
          JOB_ID=$(databricks jobs list --output JSON | jq -r '.jobs[] | select(.settings.name=="python-deployment-${{ env.ENVIRONMENT }}") | .job_id')
          if [ -z "$JOB_ID" ]; then
            databricks jobs create --json-file "databricks-job-${{ env.ENVIRONMENT }}.json"
          else
            databricks jobs reset --job-id $JOB_ID --json-file "databricks-job-${{ env.ENVIRONMENT }}.json"
          fi
        fi
        
        echo "Deployment completed to $DBFS_PATH"