name: 'Python CI/CD Pipeline'

on:
  push:
    branches:
      - main
      - develop
      - release/*
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'requirements*.txt'
      - 'setup.py'
      - '.github/workflows/python-workflow.yml'
  pull_request:
    branches:
      - main
      - develop
      - release/*
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'requirements*.txt'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  PYTHON_VERSION: '3.9'

jobs:
  lint-and-test:
    name: 'Lint and Test'
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        pytest --cov=src tests/ --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: 'Build Package'
    needs: lint-and-test
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
        
    - name: Build package
      run: |
        python -m build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/
        retention-days: 7

  deploy-to-dev:
    name: 'Deploy to DEV'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    environment: dev
    if: (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
        
    - name: Install Databricks CLI
      run: |
        pip install databricks-cli
        
    - name: Configure Databricks CLI
      run: |
        echo "host=${{ secrets.DATABRICKS_HOST_DEV }}" > ~/.databrickscfg
        echo "token=${{ secrets.DATABRICKS_TOKEN_DEV }}" >> ~/.databrickscfg
        
    - name: Create deployment directory
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        mkdir -p $DEPLOY_DIR
        cp dist/* $DEPLOY_DIR/
        cp -r src/* $DEPLOY_DIR/
        if [ -f requirements.txt ]; then cp requirements.txt $DEPLOY_DIR/; fi
        
    - name: Deploy to Databricks
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        
        # Create DBFS directory
        databricks fs mkdirs "dbfs:/FileStore/python_deployments/dev/$DEPLOY_DIR"
        
        # Upload files to DBFS
        databricks fs cp -r $DEPLOY_DIR "dbfs:/FileStore/python_deployments/dev/"
        
        echo "Deployment completed to dbfs:/FileStore/python_deployments/dev/$DEPLOY_DIR"
        echo "DBFS_PATH=/dbfs/FileStore/python_deployments/dev/$DEPLOY_DIR" >> $GITHUB_ENV

  deploy-to-qa:
    name: 'Deploy to QA'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    environment: qa
    if: (github.ref == 'refs/heads/release/*' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
        
    - name: Install Databricks CLI
      run: |
        pip install databricks-cli
        
    - name: Configure Databricks CLI
      run: |
        echo "host=${{ secrets.DATABRICKS_HOST_QA }}" > ~/.databrickscfg
        echo "token=${{ secrets.DATABRICKS_TOKEN_QA }}" >> ~/.databrickscfg
        
    - name: Create deployment directory
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        mkdir -p $DEPLOY_DIR
        cp dist/* $DEPLOY_DIR/
        cp -r src/* $DEPLOY_DIR/
        if [ -f requirements.txt ]; then cp requirements.txt $DEPLOY_DIR/; fi
        
    - name: Deploy to Databricks
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        
        # Create DBFS directory
        databricks fs mkdirs "dbfs:/FileStore/python_deployments/qa/$DEPLOY_DIR"
        
        # Upload files to DBFS
        databricks fs cp -r $DEPLOY_DIR "dbfs:/FileStore/python_deployments/qa/"
        
        echo "Deployment completed to dbfs:/FileStore/python_deployments/qa/$DEPLOY_DIR"
        echo "DBFS_PATH=/dbfs/FileStore/python_deployments/qa/$DEPLOY_DIR" >> $GITHUB_ENV

  deploy-to-prod:
    name: 'Deploy to PROD'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    environment: prod
    if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
        
    - name: Install Databricks CLI
      run: |
        pip install databricks-cli
        
    - name: Configure Databricks CLI
      run: |
        echo "host=${{ secrets.DATABRICKS_HOST_PROD }}" > ~/.databrickscfg
        echo "token=${{ secrets.DATABRICKS_TOKEN_PROD }}" >> ~/.databrickscfg
        
    - name: Create deployment directory
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        mkdir -p $DEPLOY_DIR
        cp dist/* $DEPLOY_DIR/
        cp -r src/* $DEPLOY_DIR/
        if [ -f requirements.txt ]; then cp requirements.txt $DEPLOY_DIR/; fi
        
    - name: Deploy to Databricks
      run: |
        DEPLOY_DIR="deployment-${{ github.run_id }}"
        
        # Create DBFS directory
        databricks fs mkdirs "dbfs:/FileStore/python_deployments/prod/$DEPLOY_DIR"
        
        # Upload files to DBFS
        databricks fs cp -r $DEPLOY_DIR "dbfs:/FileStore/python_deployments/prod/"
        
        echo "Deployment completed to dbfs:/FileStore/python_deployments/prod/$DEPLOY_DIR"
        echo "DBFS_PATH=/dbfs/FileStore/python_deployments/prod/$DEPLOY_DIR" >> $GITHUB_ENV