# Azure DevOps Pipeline for Python Deployment
# This pipeline automates the testing, building, and deployment of Python code to Databricks

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
  paths:
    include:
    - src/**/*.py
    - tests/**/*.py
    - requirements*.txt
    - setup.py

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
    - dev
    - qa
    - prod

variables:
  - name: pythonVersion
    value: '3.9'
  - name: azureServiceConnection
    value: 'azure-service-connection'

stages:
- stage: Test
  displayName: 'Lint and Test'
  jobs:
  - job: LintAndTest
    displayName: 'Lint and Test'
    pool:
      vmImage: 'ubuntu-latest'
    container:
      image: python:3.9-slim
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install -r requirements-dev.txt || true
        pip install -r requirements.txt || true
      displayName: 'Install dependencies'
    
    - script: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      displayName: 'Lint with flake8'
    
    - script: |
        pytest --cov=src tests/ --cov-report=xml --cov-report=html
      displayName: 'Test with pytest'
    
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage report'
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
        reportDirectory: '$(System.DefaultWorkingDirectory)/htmlcov'

- stage: Build
  displayName: 'Build Package'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: BuildPackage
    displayName: 'Build Python Package'
    pool:
      vmImage: 'ubuntu-latest'
    container:
      image: python:3.9-slim
    steps:
    - script: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
      displayName: 'Install build dependencies'
    
    - script: |
        python -m build
      displayName: 'Build Python package'
    
    - task: CopyFiles@2
      displayName: 'Copy build artifacts'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/dist'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/dist'
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'python-package'
        publishLocation: 'Container'

- stage: DeployToDev
  displayName: 'Deploy to DEV'
  dependsOn: Build
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq('${{ parameters.environment }}', 'dev')))
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to DEV Environment'
    environment: dev
    pool:
      vmImage: 'ubuntu-latest'
    container:
      image: python:3.9-slim
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: DownloadBuildArtifacts@0
            displayName: 'Download build artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'python-package'
              downloadPath: '$(System.ArtifactsDirectory)'
          
          - script: |
              pip install databricks-cli
            displayName: 'Install Databricks CLI'
          
          - script: |
              echo "host=$(DATABRICKS_WORKSPACE_URL_DEV)" > ~/.databrickscfg
              echo "token=$(DATABRICKS_TOKEN_DEV)" >> ~/.databrickscfg
            displayName: 'Configure Databricks CLI'
          
          - script: |
              DEPLOY_DIR="deployment-$(Build.BuildId)"
              mkdir -p $DEPLOY_DIR
              cp $(System.ArtifactsDirectory)/python-package/dist/* $DEPLOY_DIR/
              cp -r src/* $DEPLOY_DIR/
              if [ -f requirements.txt ]; then cp requirements.txt $DEPLOY_DIR/; fi
              
              # Create DBFS directory
              databricks fs mkdirs "dbfs:/FileStore/python_deployments/dev/$DEPLOY_DIR"
              
              # Upload files to DBFS
              databricks fs cp -r $DEPLOY_DIR "dbfs:/FileStore/python_deployments/dev/"
              
              DBFS_PATH="/dbfs/FileStore/python_deployments/dev/$DEPLOY_DIR"
              echo "Deployment completed to $DBFS_PATH"
              echo "##vso[task.setvariable variable=DBFS_PATH;]$DBFS_PATH"
            displayName: 'Deploy to DEV Databricks'

- stage: DeployToQA
  displayName: 'Deploy to QA'
